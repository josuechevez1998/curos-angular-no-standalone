<section class="flex flex-col md:flex-row items-center md:items-start gap-6 pb-10">
  <img
    src="./assets/dev.jpeg"
    alt="Nombre Apellido"
    class="w-36 h-36 md:w-40 md:h-40 rounded-full object-cover border-4 border-indigo-600 shadow-md"
  />

  <div class="text-center md:text-left max-w-xl">
    <h1 class="text-3xl font-semibold text-indigo-700 mb-2">
        {{ fullName }}
    </h1>
    <p class="text-base mb-3 max-w-xl">
      {{ description }}
    </p>
    <div class="flex items-center justify-center md:justify-start text-gray-600 space-x-2 text-sm">
      <!-- Ícono SVG ubicación -->
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-indigo-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 11c1.656 0 3-1.344 3-3s-1.344-3-3-3-3 1.344-3 3 1.344 3 3 3z" />
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 22s8-4.5 8-10-3.582-8-8-8-8 3.582-8 8 8 10 8 10z" />
      </svg>
      <span>
        {{ address }}
      </span>
    </div>
  </div>
</section>
