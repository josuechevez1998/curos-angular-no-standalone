<section class="space-y-6 w-full">
  <div *ngFor="let exp of experiences"
    class="flex items-start space-x-4 p-4 border border-indigo-200 rounded-md hover:shadow-md transition-shadow duration-200">

    <div class="flex-shrink-0 mt-1">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-indigo-600" fill="none" viewBox="0 0 24 24"
        stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M12 7V3m0 0a2 2 0 012 2v4m-2-6a2 2 0 00-2 2v4m0 0H7a2 2 0 00-2 2v7a2 2 0 002 2h10a2 2 0 002-2v-7a2 2 0 00-2-2h-3z" />
      </svg>
    </div>

    <div class="flex-1 border-l-2 border-indigo-200 pl-4">
      <div class="flex justify-between items-center mb-1">
        <h3 class="text-xl font-semibold text-indigo-700">{{ exp.company }}</h3>
        <span class="text-sm text-gray-500 italic">
          {{ exp.init_date | date: 'MMM yyyy' }} -
          {{ exp.actual ? 'Actualidad' : (exp.end_date | date: 'MMM yyyy') }}
        </span>
      </div>
      <p class="text-base text-gray-700 leading-relaxed">
        {{ exp.description }}
      </p>
    </div>
  </div>
</section>
