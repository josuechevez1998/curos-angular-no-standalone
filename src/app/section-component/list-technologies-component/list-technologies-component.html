<section class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6 pt-10 w-full">
  <div
    *ngFor="let tech of technologies"
    class="flex items-start space-x-4 p-4 border border-indigo-200 rounded-md hover:shadow-md transition-shadow duration-200"
  >
    <img
      [src]="getLogo(tech.name)"
      [alt]="tech.name"
      class="w-10 h-10 mt-1"
    />
    <div>
      <h4 class="text-lg font-semibold text-indigo-700">{{ tech.name }}</h4>
      <p class="text-sm text-gray-700">{{ getDescription(tech.name) }}</p>
    </div>
  </div>
</section>
